app = "mx-ui"
primary_region = "fra"

[build]
dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  TLS_MODE = "auto"
  DATA_DIR = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[mounts]]
  source = "mxui_data"
  destination = "/data"
