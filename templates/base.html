<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>{% block title %}MX-UI{% endblock %}</title>
  <link rel="icon" type="image/svg+xml" href="/static/img/mxui-icon.svg">
  <link rel="icon" type="image/png" href="/static/img/mxui-icon.png">
  <link rel="preload" href="/static/fonts/Inter-Regular.otf" as="font" type="font/otf" crossorigin>
  <link rel="preload" href="/static/fonts/Inter-Medium.otf" as="font" type="font/otf" crossorigin>
  <link rel="preload" href="/static/fonts/Inter-SemiBold.otf" as="font" type="font/otf" crossorigin>
  <link rel="preload" href="/static/fonts/Inter-Bold.otf" as="font" type="font/otf" crossorigin>
  <link rel="preload" href="/static/fonts/DejaVuSansMono.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="preload" href="/static/fonts/NotoKufiArabic-Regular.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&family=Noto+Kufi+Arabic:wght@400;700&family=Vazirmatn:wght@400;600;700&display=swap" media="print" onload="this.media='all'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&family=Noto+Kufi+Arabic:wght@400;700&family=Vazirmatn:wght@400;600;700&display=swap"></noscript>
  <script>
    try {
      var t = localStorage.getItem('mx-theme');
    } catch (e) {}
    document.documentElement.dataset.theme = t || 'dark';
  </script>
  <link rel="stylesheet" href="/static/css/app.css">
  {% block head_extra %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">
  {% block content %}{% endblock %}
  <div id="toast" class="toast" role="status"></div>
  <script src="/static/js/utils.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
